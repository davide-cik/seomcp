# Landing statica di seomcp. Serve la cartella site/ del repository.
# Attivazione: vedi deploy/README.md. Certbot aggiunge da solo il blocco HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name seomcp.contentisking.guru;

    root /home/datareport/seomcp/site;
    index index.html;

    # Include lato server: intestazione, footer e griglia client sono in site/_partials/.
    ssi on;

    # Redirect 301 e pagina 404, generati da scripts/build-site.py.
    include /home/datareport/seomcp/deploy/nginx-seomcp-extra.conf;
    charset utf-8;

    server_tokens off;
    client_max_body_size 1k;

    # Security headers. La pagina non usa risorse esterne: CSP molto restrittiva.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 500;

    # Solo metodi di lettura: è un sito statico.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg)$ {
        expires 7d;
    }

    # I partial si usano solo tramite include, non sono raggiungibili direttamente.
    location /_partials/ {
        internal;
    }

    # Mai servire file nascosti.
    location ~ /\. {
        deny all;
    }
}
